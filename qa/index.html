<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Token Portrait · SDK test harness</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#232631;color:#eee;font:13px system-ui;overflow:hidden}
header{position:absolute;left:12px;top:10px;z-index:2;max-width:calc(100% - 24px);background:#232631e8;padding:8px;border-radius:6px}
small{display:block;color:#bfc3d3}button{font:inherit;color:inherit;background:#424655;border:1px solid #696d7d;border-radius:5px;padding:7px;cursor:pointer}
nav{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}#board{position:absolute;inset:0;background-image:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:50px 50px}
.token{position:absolute;width:72px;height:90px;top:42%;padding:0;background:transparent;border:2px solid transparent}.token img{width:100%;height:100%;object-fit:contain}.token[aria-pressed=true]{border-color:#ae9bff}
#a{left:40%}#b{left:60%}#portrait{position:absolute;pointer-events:none;object-fit:contain}
#dock{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:#424655;padding:12px;border-radius:9px;white-space:nowrap}
#under{position:absolute;left:84px;bottom:110px;width:60px;height:80px;opacity:.5}
aside{position:absolute;right:12px;top:40%;width:40px;padding:12px;background:#424655;border-radius:9px}
</style></head><body>
<div id="board"><button id="under">Under portrait</button><button id="a" class="token" aria-label="Select Amber" aria-pressed="false"><img src="./amber.svg"></button><button id="b" class="token" aria-label="Select Blue" aria-pressed="false"><img src="./blue.svg"></button></div>
<header><strong>Token Portrait · Test harness</strong><small>Simulated SDK host — not the Owlbear interface</small><nav id="menus"></nav><nav>
<button id="clear">Deselect</button><button id="multi">Multi-select</button><button id="shape">Select shape</button><button id="delete">Delete selected</button><button id="scene">Close / reopen scene</button><button id="pan">Pan / zoom</button>
</nav><small id="status">Ready</small></header>
<aside>＋<br><br>⌖<br><br>▱</aside><div id="dock">Reserved bottom tool area</div>
<script type="module" src="./harness.ts"></script></body></html>
