<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portrait</title><link rel="stylesheet" href="/src/panel.css"></head><body>
<fieldset id="preferences" disabled>
  <div class="settings-row">
    <label class="setting">ตำแหน่ง<select id="side" aria-label="ตำแหน่ง"><option value="left">ซ้ายล่าง</option><option value="right">ขวาล่าง</option></select></label>
    <label class="setting">ขนาด<select id="size" aria-label="ขนาด"><option value="180">เล็ก · 180px</option><option value="240">กลาง · 240px</option><option value="300">ใหญ่ · 300px</option></select></label>
  </div>
  <label class="visibility-row" title="แสดงหรือซ่อนภาพ Portrait">
    <input type="checkbox" id="enabled" aria-label="แสดงภาพ Portrait">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg>
    <span>แสดงภาพ Portrait</span>
  </label>
</fieldset>
<fieldset id="artwork" disabled>
  <button id="choose" class="menu-row" type="button" aria-label="เลือกรูปจากคลัง Owlbear" title="เลือกรูปจากคลัง Owlbear">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m4 17 5-5 4 4 3-3 5 5"/></svg><span>เลือกรูปจากคลัง</span>
  </button>
  <form id="url-form">
    <label class="setting url-label" for="url">ลิงก์รูปภาพ HTTPS</label>
    <div class="url-row"><input id="url" type="url" placeholder="https://…/portrait.png" required autocomplete="off"><button id="save" type="submit" class="icon-button" aria-label="บันทึก" title="บันทึกลิงก์รูปภาพ"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button></div>
  </form>
  <button id="clear" class="menu-row" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7M14 10v7"/></svg><span>ล้างรูปที่ผูกไว้</span></button>
</fieldset>
<p id="status" role="status" aria-live="polite">กำลังอ่าน Token…</p>
<script type="module" src="/src/panel-entry.ts"></script></body></html>
