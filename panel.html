<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portrait</title><style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;padding:12px;font:14px system-ui;color:var(--text,#eee);background:var(--paper,#323342)}fieldset{margin:0;padding:0;border:0;min-width:0}.row{display:flex;gap:12px;margin-bottom:12px}.row>label{flex:1;min-width:0}label{display:block}select,input[type=url]{width:100%;margin-top:5px;padding:7px 8px;border:1px solid var(--line,#767681);border-radius:4px;background:var(--paper,#323342);color:inherit;font:inherit}button{font:inherit;color:inherit;background:transparent;border:1px solid var(--line,#767681);border-radius:4px;padding:8px;cursor:pointer}button:disabled,fieldset:disabled{opacity:.55;cursor:default}#choose{width:100%;margin:10px 0}#url-label{font-size:13px}.url-row{display:flex;align-items:end;gap:6px}.url-row input{min-width:0;flex:1}.url-row button{white-space:nowrap}#clear{margin-top:10px}p{font-size:12px;margin:7px 0;overflow-wrap:anywhere;color:var(--muted,#c5c5ce)}input[type=checkbox]{accent-color:var(--primary,#bb9af7)}
</style></head><body>
<fieldset id="preferences" disabled><div class="row"><label>ตำแหน่ง<select id="side" aria-label="ตำแหน่ง"><option value="left">ซ้ายล่าง</option><option value="right">ขวาล่าง</option></select></label><label>ขนาด<select id="size" aria-label="ขนาด"><option value="180">เล็ก · 180px</option><option value="240">กลาง · 240px</option><option value="300">ใหญ่ · 300px</option></select></label></div><label><input type="checkbox" id="enabled"> แสดงภาพ Portrait</label></fieldset>
<fieldset id="artwork" disabled><button id="choose" type="button">เลือกรูปจากคลัง Owlbear</button><form id="url-form"><label id="url-label" for="url">ลิงก์รูปภาพ HTTPS</label><div class="url-row"><input id="url" type="url" placeholder="https://…/portrait.png" required autocomplete="off"><button id="save" type="submit">บันทึก</button></div></form><button id="clear" type="button">ล้างรูปที่ผูกไว้</button></fieldset><p id="status" role="status" aria-live="polite">กำลังอ่าน Token…</p>
<script type="module" src="/src/panel-entry.ts"></script></body></html>
